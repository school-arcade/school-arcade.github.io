<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road • Εκπαιδευτήρια Γείτονα</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #131722;
            background-image: linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #f8fafc; font-family: 'Fira Code', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden; margin: 0; padding: 10px 20px;
        }
        .top-section { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e2536; padding: 8px 16px; border-radius: 10px; border: 1px solid #334155; }
        .back-btn { background: #38bdf8; color: #0f172a; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; }
        .back-btn:hover { background: #7dd3fc; }
        .game-header-title { font-size: 1.05rem; font-weight: 700; color: #4ade80; }
        .instructions-box { background: #1e2536; border-left: 4px solid #fbbf24; border-radius: 8px; padding: 7px 15px; display: flex; align-items: center; gap: 12px; }
        .instructions-title { font-size: 0.9rem; color: #fbbf24; font-weight: 700; white-space: nowrap; }
        .instructions-text { font-family: 'Patrick Hand', cursive; font-size: 1.2rem; color: #e2e8f0; margin: 0; line-height: 1.2; }
        .subtitle-banner {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.18), rgba(251, 191, 36, 0.22), rgba(74, 222, 128, 0.18));
            border: 2px solid #fbbf24; border-radius: 10px; padding: 6px 18px;
            text-align: center; font-size: 0.85rem; font-weight: 700; color: #ffffff;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
        }
        .hl-gold { color: #fbbf24; } .hl-green { color: #4ade80; } .hl-blue { color: #38bdf8; }
        .main-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 0 2px 0; }
        .game-wrapper { height: 100%; max-width: 100%; aspect-ratio: 4 / 3; background: #0f172a; border: 2px solid #334155; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; }
        .window-bar { background: #1e2536; padding: 7px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ef4444; } .yellow { background: #f59e0b; } .green { background: #10b981; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Πίσω στο Μενού</a>
            <div class="game-header-title">&gt;_ Road</div>
        </div>
        <div class="instructions-box">
            <div class="instructions-title">📝 Οδηγίες:</div>
            <p class="instructions-text">Πάτησε την πράσινη σημαία για να ξεκινήσεις. Χρησιμοποίησε τα βελάκια του πληκτρολογίου για κίνηση!</p>
        </div>
        <div class="subtitle-banner">
            <span class="hl-blue">//</span> Φτιαγμένο από <span class="hl-gold">μαθητές Α Γυμνασίου</span> με <span class="hl-green">Scratch</span> • Πρόγραμμα σπουδών <span class="hl-blue">Πληροφορικής Α Γυμνασίου</span>
        </div>
    </div>
    <div class="main-area">
        <div class="game-wrapper">
            <div class="window-bar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
            <iframe src="game3.html" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
