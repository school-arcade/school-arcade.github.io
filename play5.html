<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacMan • Εκπαιδευτήρια Γείτονα</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        body {
            background-color: #131722;
            background-image:
                radial-gradient(circle at 50% 15%, rgba(56, 189, 248, 0.14), transparent 60%),
                linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #f8fafc;
            font-family: 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px 20px 24px 20px;
            gap: 10px;
        }
        .top-section {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(30, 37, 54, 0.96));
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
        .back-btn {
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        .back-btn:hover, .back-btn:focus-visible {
            background: #7dd3fc;
            transform: translateY(-1px);
            outline: none;
        }
        .game-header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #4ade80;
            text-align: right;
        }
        .instructions-box {
            background: rgba(30, 37, 54, 0.95);
            border-left: 4px solid #fbbf24;
            border-top: 1px solid rgba(251, 191, 36, 0.25);
            border-right: 1px solid rgba(251, 191, 36, 0.25);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .instructions-title {
            font-size: 0.9rem;
            color: #fbbf24;
            font-weight: 700;
            white-space: nowrap;
        }
        .instructions-text {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.2rem;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.25;
        }
        .main-area {
            flex: 1;
            width: 100%;
            max-width: 960px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .game-wrapper {
            width: 100%;
            max-width: min(100%, 760px);
            aspect-ratio: 4 / 3;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(56, 189, 248, 0.22);
            display: flex;
            flex-direction: column;
        }
        .window-bar {
            background: #0f172a;
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.35);
            flex-shrink: 0;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .red { background: #ef4444; }
        .yellow { background: #f59e0b; }
        .green { background: #10b981; }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: block;
        }
        @media (max-width: 640px) {
            body { padding: 10px 12px 24px 12px; }
            .top-bar { padding: 8px 10px; }
            .back-btn { padding: 6px 10px; font-size: 0.78rem; }
            .game-header-title { font-size: 0.92rem; }
            .instructions-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 8px 12px;
            }
            .instructions-text { font-size: 1.08rem; }
            .game-wrapper {
                max-width: 100%;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Πίσω στο Μενού</a>
            <div class="game-header-title">&gt;_ PacMan</div>
        </div>
        <div class="instructions-box">
            <div class="instructions-title">📝 Οδηγίες:</div>
            <p class="instructions-text">Πάτησε την πράσινη σημαία για να ξεκινήσεις. Χρησιμοποίησε τα βελάκια για να φας το φαγητό και να αποφύγεις τα φαντάσματα!</p>
        </div>
    </div>
    <div class="main-area">
        <div class="game-wrapper">
            <div class="window-bar">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <iframe src="game5.html" title="PacMan" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
