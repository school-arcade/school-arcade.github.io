<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacMan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        body {
            background-color: #131722;
            background-image:
                radial-gradient(circle at 50% 15%, rgba(56, 189, 248, 0.14), transparent 60%),
                linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #f8fafc;
            font-family: 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px 16px 12px 16px;
            gap: 8px;
        }
        .top-section {
            width: 100%;
            max-width: min(100%, 1120px, calc((100vh - 118px) * 4 / 3));
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(30, 37, 54, 0.96));
            padding: 8px 16px;
            border-radius: 14px;
            border: 2px solid #38bdf8;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-family: Verdana, sans-serif;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            line-height: 1.1;
            white-space: nowrap;
            flex-shrink: 0;
            align-self: center;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        .back-btn:hover, .back-btn:focus-visible {
            background: #7dd3fc;
            transform: translateY(-1px);
            outline: none;
        }
        .banner-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .banner-tip,
        .banner-tip-sub {
            font-family: Verdana, sans-serif;
            font-size: 1.05rem;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.28;
            text-align: center;
        }
        .restart-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            background: #4ade80;
            color: #0f172a;
            border: none;
            cursor: pointer;
            font-family: Verdana, sans-serif;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            line-height: 1.1;
            white-space: nowrap;
            flex-shrink: 0;
            align-self: center;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        .restart-btn:hover, .restart-btn:focus-visible {
            background: #22c55e;
            transform: translateY(-1px);
            outline: none;
        }
        .btn-icon {
            font-size: 1.05rem;
            line-height: 1;
        }
        .main-area {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .game-wrapper {
            width: 100%;
            max-width: min(100%, 1120px, calc((100vh - 118px) * 4 / 3));
            max-height: calc(100vh - 118px);
            aspect-ratio: 4 / 3;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(56, 189, 248, 0.22);
            display: flex;
            flex-direction: column;
        }
        .window-bar {
            background: #0f172a;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.35);
            flex-shrink: 0;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .red { background: #ef4444; }
        .yellow { background: #f59e0b; }
        .green { background: #10b981; }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: block;
        }
        @media (max-width: 720px) {
            body { padding: 10px 12px 24px 12px; }
            .top-section { max-width: 100%; }
            .top-banner {
                flex-wrap: wrap;
                padding: 8px 10px;
                gap: 8px;
                border-radius: 12px;
            }
            .back-btn, .restart-btn {
                min-height: 36px;
                padding: 8px 12px;
                font-size: 0.78rem;
            }
            .back-btn { order: 1; }
            .restart-btn { order: 2; }
            .banner-lines {
                order: 3;
                flex: 1 1 100%;
                align-items: flex-start;
            }
            .banner-tip,
            .banner-tip-sub {
                font-size: 0.95rem;
                text-align: left;
            }
            .game-wrapper {
                max-width: 100%;
                max-height: none;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="top-banner">
            <a href="index.html" class="back-btn"><span class="btn-icon" aria-hidden="true">‹</span><span>Πίσω στο Μενού</span></a>
            <div class="banner-lines">
                <p class="banner-tip">Πάτησε την πράσινη σημαία για να ξεκινήσεις.</p>
                <p class="banner-tip-sub">Χρησιμοποίησε τα βελάκια για να φας το φαγητό και να αποφύγεις τα φαντάσματα!</p>
            </div>
            <button type="button" id="restart-btn" class="restart-btn"><span class="btn-icon" aria-hidden="true">⟲</span><span>Παίξε ξανά</span></button>
        </div>
    </div>
    <div class="main-area">
        <div class="game-wrapper">
            <div class="window-bar">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <iframe id="game-frame" src="game5.html" title="PacMan" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        (function () {
            const restartBtn = document.getElementById('restart-btn');
            const gameFrame = document.getElementById('game-frame');
            const baseSrc = gameFrame.getAttribute('src');

            restartBtn.addEventListener('click', function () {
                gameFrame.src = 'about:blank';
                requestAnimationFrame(function () {
                    gameFrame.src = baseSrc;
                    gameFrame.focus();
                });
            });
        })();
    </script>
</body>
</html>
